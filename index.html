<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Score Evaluator by Group 9 - 2IT-B</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Student Score Evaluator</h1>
            <p class="subtitle">Find out how well you did!</p>
            <button id="startBtn">Start Evaluation</button>
            <div id="resultBox" class="result-box hidden">
                <h2>Evaluation Result</h2>
                <p><strong>Student Name:</strong> <span id="nameOutput"></span></p>
                <p><strong>Final Score:</strong> <span id="scoreOutput"></span></p>
                <p><strong>Remark:</strong> <span id="remarkOutput"></span></p>
            </div>
        </div>
        <footer>
            <p>&copy; 2026 Group 9 - 2IT-B</p>
            <i>Made by Alxen John F., Steven Kyle M., and Andrhea Joyce P.</i>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
